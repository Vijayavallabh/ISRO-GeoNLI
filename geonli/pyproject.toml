[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geonli"
version = "0.1.0"
description = "Flexible remote sensing toolkit for Captioning, Grounding, and VQA"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ISRO-GeoNLI Team"}
]
requires-python = ">=3.9"
keywords = ["remote-sensing", "VLM", "SAM", "captioning", "grounding", "VQA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
    "torchvision",
]
transformers = [
    "transformers>=4.40",
    "accelerate",
    "qwen-vl-utils",
]
sam = [
    "opencv-python>=4.8",
]
dev = [
    "pytest",
    "black",
    "ruff",
]
all = [
    "geonli[torch,transformers,sam,dev]"
]

[project.scripts]
geonli-run = "geonli.cli.run:main"

[project.urls]
Homepage = "https://github.com/your-org/geonli"
Repository = "https://github.com/your-org/geonli"

[tool.setuptools.packages.find]
where = ["."]
include = ["geonli*"]
